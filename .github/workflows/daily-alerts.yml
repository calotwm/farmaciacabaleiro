name: Daily alerts

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 Argentina (UTC-3)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$APP_URL/api/cron/daily" -H "Authorization: Bearer $CRON_SECRET"
